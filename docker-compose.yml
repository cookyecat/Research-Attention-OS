services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raos
      POSTGRES_PASSWORD: raos
      POSTGRES_DB: raos
    ports:
      - "5432:5432"
    volumes:
      - raos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raos -d raos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raos_pg:

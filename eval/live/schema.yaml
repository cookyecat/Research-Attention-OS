# Structural schemas are defined in schema.py (Pydantic). This file documents the Live Case YAML shape.

id: string
source:
  type: TEXT|URL|PDF|PAPER|REPO|POST|MANUAL_OBSERVATION
  title: string|null
  url: string|null
  local_file: string|null
  text: string|null
kernel_fixture: mvp
source_kind: news|paper|technical_blog|field_observation|investment|hype|cross_domain_analogy|wechat|github|company_blog
cognitive_tasks:
  - topic_relevance
  - structural_relevance
  - belief_conflict
  - decision_relevance
  - evidence_verification
gold_status: LABELED|UNLABELED

# Human Gold v2 — the only default annotation template.
# Locate → kernel_targets | Estimate → cognitive_effects + expected_delta | Route → attention_state + processing_modes
human_gold:
  attention_state: []          # multi-select: DROP | AWARE | WATCH | ENGAGE
  processing_modes: []         # multi-select: SCAN | LEARN | VERIFY | DEEP_DIVE | SYNTHESIZE
  kernel_targets: []           # Kernel titles/ids, or [NONE]
  cognitive_effects: []        # multi-select: REINFORCE | CHALLENGE | REFINE | OPEN_NEW | NO_MATERIAL_CHANGE
  expected_delta: ""           # free text: what absorbing this should add, correct, or form

# STANDING RADAR FIT — INTERSECTION / SEMANTIC COMPOSITION DIAGNOSTIC v1
#
# Human-elicited diagnostic for the narrow residual hypothesis observed in the
# first D holdout: when an event contains both an explicitly excluded context
# and a substantive standing-interest facet, does the frozen estimator follow
# the substantive facet or allow the exclusion to dominate?
#
# This is NOT a new overall D benchmark and must not be merged into the FD1-FD20
# first-run accuracy. It is a targeted causal diagnostic only.
#
# Frozen estimator to use unchanged:
#   estimator_version: standing-radar-fit-estimator-v1
#   prompt_version: standing-radar-fit-v1
#   prompt_sha256: 92179131d684d84e9b6f214389c0166cb9137a12e22f44826380d2fc063da749
#
# Human labels were answered twice with identical results before this manifest
# was written.
#
# Frozen: 2026-09-06
# Label provenance: HUMAN_ELICITED

name: raos-standing-radar-intersection-diagnostic-v1
variable: D
diagnostic_type: INTERSECTION_SEMANTIC_COMPOSITION
semantic_contract: >-
  D = Standing Interest Fit independent of event significance. Ignore importance,
  popularity, final AWARE/DROP disposition, and Kernel change. Judge whether the
  event's substantive topic belongs to a world the user wants RAOS to monitor on
  a standing basis.
profile: eval/live/standing_radar_profile.v1.yaml
frozen_estimator_version: standing-radar-fit-estimator-v1
frozen_prompt_version: standing-radar-fit-v1
frozen_prompt_sha256: 92179131d684d84e9b6f214389c0166cb9137a12e22f44826380d2fc063da749
hypothesis: >-
  The first-run residuals may reflect an arbitration failure in which an explicit
  standing exclusion overrides a substantive standing-interest facet. This
  diagnostic tests that narrow hypothesis without changing the estimator, prompt,
  profile, or ontology.

pre_registered_interpretation:
  overall_exact_min: 0.875   # >= 7/8
  positive_intersection_recall_min: 0.75  # IX2/IX4/IX6/IX8: >= 3/4 IN
  complete_pair_flip_min: 0.75  # >= 3/4 pairs have OUT control + IN intersection
  decision_rule: >-
    If all three criteria pass and there is no repeated exclusion-dominance pattern,
    treat the D estimator as sufficient for Phase II-B and close the D study. If the
    positive intersection variants repeatedly stay OUT, preserve the result as a
    semantic-composition/arbitration failure and design the smallest follow-up;
    do not retune on this diagnostic.


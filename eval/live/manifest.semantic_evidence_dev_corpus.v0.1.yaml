name: raos-semantic-evidence-development-corpus-v0.1
status: DEVELOPMENT_ONLY_NOT_FRESH_VALIDATION
interface_version: semantic-evidence-frame-v0.1
created_at: 2026-09-07
purpose: >-
  First real/raw-source development corpus for calibrating the Semantic Evidence
  Extraction / Sensor Front-End. These sources may be inspected, prompt-tuned,
  annotated, and reused for development. They must never later be reported as
  fresh holdout evidence for the extractor.

methodology:
  - Raw source files remain unchanged; provenance is pinned by git_blob_sha.
  - Sources 01-12 and 15 are development data.
  - Sources 13-14 are intentionally not included in this development manifest and should remain uninspected by extractor-development code until explicitly promoted to another role.
  - This corpus may expose representation failures; v0.1 is not yet frozen.
  - Do not assume one raw source necessarily contains exactly one event.
  - Do not add D/S/P/A labels to the sensor frame.


semantic_contract: >-
  P judges whether, at the stated evaluation time, an event has already formed,
  or is clearly forming, a salient state of genuine collective attention within
  the event's Objective Attention Constituency. Attention is interpreted relative
  to the scale of that constituency and has temporal inertia. Ignore user interest,
  intrinsic event importance/material consequence, sentiment, stance, and downstream
  attention-action decisions.

pre_registered_criterion:
  expected_scorable_cases: 12
  exact_min: 0.8333333333
  salient_recall_min: 0.80
  not_salient_recall_min: 0.80
  insufficient_evidence_should_be_zero: true
  technical_failures_should_be_zero: true
  no_clear_repeated_semantic_failure: true


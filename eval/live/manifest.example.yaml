#
# Known future cases (only when original materials exist in-repo or locally):
#   银河通用, SpaceClaw / WorldDreamer, 共生知行, 创业股权案例
#
# Human Gold is NEVER produced by a model. Empty gold => UNLABELED
# (run is stored, excluded from accuracy denominators).
#
# Default Human Gold template (fill these five fields only):
#   human_gold:

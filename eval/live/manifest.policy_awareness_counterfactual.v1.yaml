# RAOS Oracle-Awareness Attention Policy — Counterfactual Gold v1
#
# Tests whether three frozen non-cognitive situational-awareness signals are
# sufficient for DROP ↔ AWARE when canonical Δ=NONE.
#
# Candidate policy (elicited from Human Gold; implemented in production route()):
#   if Δ is NONE:
#       AWARE iff event_significance and (domain_fit or attention_momentum)
#       otherwise DROP
#
# These signals are not CognitiveEffect / Δ. They must never create
# REINFORCE / CHALLENGE / OPEN_NEW, and must never create WATCH or ENGAGE.
#
# The 8 cases are the Boolean cube of (domain_fit, event_significance,
# attention_momentum). Notes keep the Group 1 elicitation language so Human
# Gold provenance stays clear. Case 1 is the all-false cell (the elicitation
# list duplicated the in-domain / insignificant / no-momentum cell as 1 and 5).
#
# Do not estimate D/S/M from source text. This experiment uses Oracle values only.
#
#   python eval/live/run_live_eval.py --oracle-only \
#     --manifest eval/live/manifest.policy_awareness_counterfactual.v1.yaml


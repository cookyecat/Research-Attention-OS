name: raos-semantic-sensor-auditor-broadening-v0.1
status: DEVELOPMENT_ONLY_PREREGISTERED
created_at: 2026-09-07
purpose: >-
  Cross-source broadening after RS02 saturation. Freeze the current Semantic Sensor
  and Semantic Evidence Auditor, then inspect whether previously observed failure
  structures repeat across heterogeneous development sources before changing any
  mechanism.

methodology_contract:
  anti_overfitting_protocol: 56_SENSOR_AUDITOR_GENERALIZATION_AND_ANTI_OVERFITTING_PROTOCOL.md
  rs02_status: SATURATED_DEVELOPMENT
  rs02_use: REGRESSION_AND_BUG_REPRODUCTION_ONLY
  reserved_sources_must_remain_unconsumed:
    - RS13
    - RS14
  no_between_source_tuning: true
  no_new_rule_from_single_source: true
  mechanism_change_requires_cross_source_repetition: true

frozen_system:
  sensor:
    version: semantic-evidence-extractor-v0.2.2
    prompt_version: semantic-evidence-extraction-v0.2.2
    prompt_sha256: 52bae84a3d06bbaa597cdbf43460c8945dcd13cb53616390c05a6a40995dfbe9
    structured_schema: SemanticExtractionBatchV0_2
    temporal_anchor_policy: measurement-time-never-substitutes-source-time-v0.2.1
    audit_policy: sufficient-provenance-attribution-locator-dedup-v0.2.2
    thinking: disabled
    temperature: 0.1
  auditor:
    version: semantic-evidence-auditor-v0.1.1
    prompt_version: semantic-evidence-audit-v0.1.1
    prompt_sha256: d22540217a0bec35468e327c6b6df8041eee7fb1c79dd676cfa38935774b81bb
    decision_policy: binary-sufficiency-v0.1.1
    audit_scope: one-semantic-object-vs-cited-evidence-only
    thinking: disabled
    temperature: 0.1
  evidence_policy:
    mode: BASELINE_CITED_EVIDENCE_ONLY
    packet_v0_1_augmentation: disabled
    rationale: >-
      Evidence Packet v0.1 has only partial RS02 development support and must not be
      promoted to a general default before cross-source evidence exists.

source_order:
  - id: RS11
    genre: news_release_like
    path: eval_samples/11_刚刚，Qwen3.8-Flash震撼发布，我们看到了Qwen4的骨架.txt
    git_blob_sha: 334ce867f9888bf07e6f851a9d19c51f033506af
    lifecycle_before_run: DEVELOPMENT_ACTIVE
  - id: RS05

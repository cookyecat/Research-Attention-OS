    lifecycle_before_run: DEVELOPMENT_ACTIVE

predeclared_sensor_observations:
  - first_pass_structural_validity
  - repair_usage
  - event_frame_count
  - epistemic_unit_count
  - semantic_omission
  - semantic_overreach
  - actor_time_scope_fidelity
  - event_epistemic_decomposition
  - provenance_traceability
  - provenance_support_sufficiency
  - context_dependency
  - metadata_dependency

predeclared_auditor_observations:
  - first_pass_structural_validity
  - sufficient_count
  - insufficient_count
  - reason_code_distribution
  - likely_false_accept
  - likely_false_reject
  - repeated_failure_structure_across_sources

interpretation_rules:
  - Do not report sufficient_rate as Auditor accuracy without Human Gold.
  - Do not modify Sensor, Auditor, prompt, schema, or evidence policy between sources.
  - If an implementation/instrumentation bug invalidates the round, archive it as invalid, fix the bug, version the fix, and restart or separate the round.
  - A pattern seen in only one broadening source is a local residual, not a new general rule.
  - Mechanism redesign is considered only after the same causal structure repeats across materially different sources and survives Human adjudication.

fresh_validation: NONE

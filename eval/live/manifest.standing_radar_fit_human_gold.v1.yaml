# STANDING RADAR FIT — HUMAN GOLD v1
#
# Fresh Human Gold for Phase II-B D estimator measurement.
# Labels were elicited after the D answering instrument and Standing Radar profile
# were calibrated, and before implementation/measurement of the estimator.
#
# IMPORTANT:
# - Do not use these labels or case-specific rationales in the estimator prompt.
# - The estimator may consume `standing_radar_profile.v1.yaml` plus event text only.
# - First model predictions against this holdout are the measurement; do not tune
#   the estimator on these labels and then re-report the same set as holdout.
#
# Frozen: 2026-09-06
# Label provenance: HUMAN_ELICITED
# Standing Radar input: eval/live/standing_radar_profile.v1.yaml

name: raos-standing-radar-fit-human-gold-v1
variable: D
semantic_contract: >-
  D = Standing Interest Fit independent of event significance. Ignoring importance,
  popularity, final AWARE/DROP disposition, and Kernel change, judge whether the
  event's substantive topic belongs to a world the user wants RAOS to monitor on a
  standing basis.
profile: eval/live/standing_radar_profile.v1.yaml
elicited_before_estimator_measurement: true

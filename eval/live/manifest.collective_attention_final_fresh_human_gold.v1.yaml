# were frozen, and AFTER the fresh PF1-PF12 validation template was frozen at
# commit e57b403fcacb1ff8f49aad23fe78a7266859c06a.
#
# Labels were supplied before any scored estimator prediction on PF1-PF12.
# PC1-PC24 remain development/calibration evidence only.

name: raos-collective-attention-final-fresh-human-gold-v1
variable: P
validation_type: FINAL_FRESH_VALIDATION
estimator_version: collective-attention-estimator-v1

# STANDING RADAR PROFILE v2
#
# Minimal semantic-composition repair of v1.
# Historical v1 remains frozen and must not be rewritten.
#
# This profile still estimates only D = Standing Interest Fit independent of
# event significance. It does not encode S, P, AWARE/DROP, or Kernel change.
#
# Repair intent:
# - preserve multiple substantive semantic facets instead of collapsing an event
#   to one dominant domain;
# - treat exclusions as scope guards against over-broad matching, not vetoes;
# - broaden the cancer/tumor standing-interest wording to match the user's
#   demonstrated preference over substantive cancer/tumor scientific, clinical,
#   diagnostic, treatment, surgical, and technical events.
#
# Frozen for fresh v2 validation: 2026-09-06

name: standing-radar-profile-v2
semantic_contract: >-
  D = Standing Interest Fit independent of event significance. Ignore how important,
  popular, or attention-worthy the current event is. Identify the event's substantive
  semantic facets and judge whether at least one genuinely belongs to a world the user
  wants RAOS to monitor on a standing basis.

invariants:
  - "An event may contain multiple substantive semantic facets; do not force it into one dominant domain."
  - "A substantive facet is itself part of what is being developed, released, studied, deployed, measured, changed, or operated; an incidental tool, implementation detail, organizational context, or application setting is not enough by itself."
  - "Incidental mention or ordinary use of AI/GPU/Python/cloud/neural networks does not create radar membership."
  - "Standing exclusions are scope guards against over-broad matching. They do not veto a genuine substantive standing-interest facet."
  - "If at least one substantive semantic facet genuinely matches a standing interest, D is IN even when another substantive/contextual facet lies in an excluded area."
  - "D granularity follows stable preference, not taxonomy depth."
  - "Do not infer facts not stated in the event."
  - "Do not answer AWARE/DROP, significance S, public salience P, or Kernel change."

standing_interests:
  - "LLMs, foundation models, Agents, multimodal AI, and closely related AI systems"
  - "Robotics, embodied intelligence, Physical AI, including domain robots when robotics is a substantive event topic"
  - "AI compute and compute-oriented semiconductors: GPU/CPU, AI accelerators, HBM, advanced process, and related compute hardware"
  - "Cloud computing, data centers, networking, storage, distributed data infrastructure"
  - "Autonomous driving, Robotaxi, intelligent-vehicle driving systems"
  - "Quantum computing"
  - "Brain-computer and neural interfaces"
  - "Cybersecurity"
  - "Consumer electronics, phones, PCs, operating systems, smart-device ecosystems"
  - "Internet platforms, social/content platforms, product and distribution-rule changes"
  - "Gaming: games, game products, studios, platforms, and the game industry"
  - "Financial markets, monetary/macroeconomic policy, IPO/VC/corporate finance, major business/market structure"
  - "Basic science, including physics, mathematics, astronomy, and materials science"
  - "Films, film works, creators/actors, entertainment and entertainment-cultural phenomena"
  - "Cancer and tumor topics, including substantive cancer/tumor science, diagnosis, treatment, clinical practice, surgical/medical technology, and other cancer/tumor-specific developments"

standing_exclusions:
  - "General non-AI biomedicine outside substantive cancer/tumor topics"
  - "New energy, batteries, grid, fusion, and energy industry as such"
  - "Commercial space, rockets, satellites, lunar exploration as such"
  - "Ordinary analog, power-management, motor-control, and industrial chips unrelated to compute/AI/advanced-process interests"
  - "Ordinary film-production technique/workflow such as lighting, grading, traditional VFX, and post-production process when no monitored film/cultural topic is involved"

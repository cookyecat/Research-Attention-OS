name: raos-phase6a-controlled-p-packets-v0.1
status: DEVELOPMENT_ONLY_WIRING_EVIDENCE
purpose: >-
  Controlled external attention-sensor packets for Phase 6A vertical-slice wiring.
  These observations are synthetic test inputs, not claims about real-world current attention.
as_of: "2026-09-08T00:00:00Z"
policy:
  - Event semantics must be injected from the audited event projection at runtime.
  - Constituency and attention observations are independent test inputs, not inferred from article wording.
  - Labels are not stored; P v1 must infer SALIENT/NOT_SALIENT from the packet.
  - Conditions alternate strong/low salience to exercise the P sensor path without encoding a final action.

